<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin"><title>Vesper trailer</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}#p{position:absolute;left:0;top:0;width:100%;height:100%}</style></head>
<body><div id="p"></div>
<script>
// Vesper's TV app is a local file, which YouTube won't play inside. This page lives on a real address and holds the
// official YouTube player for it; the TV talks to it with postMessage (play / pause / mute / unmute) and hears back its state.
(function(){
  var q=new URLSearchParams(location.search),id=q.get("v")||"",start=+q.get("t")||0,muted=q.get("m")==="1",P=null;
  function post(o){o.vt=1;try{parent.postMessage(o,"*");}catch(e){}}
  window.onYouTubeIframeAPIReady=function(){
    P=new YT.Player("p",{width:"100%",height:"100%",videoId:id,
      playerVars:{autoplay:1,controls:0,disablekb:1,fs:0,rel:0,modestbranding:1,playsinline:1,iv_load_policy:3,start:start,mute:muted?1:0,cc_load_policy:0},
      events:{onReady:function(e){if(muted)e.target.mute();e.target.playVideo();post({ev:"ready",d:e.target.getDuration()});},
        onStateChange:function(e){post({ev:"state",s:e.data,t:P.getCurrentTime(),d:P.getDuration()});},
        onError:function(e){post({ev:"error",code:e.data});}}});};
  window.addEventListener("message",function(e){var m=e.data||{};if(!P||!m.cmd)return;
    try{if(m.cmd==="play")P.playVideo();else if(m.cmd==="pause")P.pauseVideo();else if(m.cmd==="mute")P.mute();
      else if(m.cmd==="unmute"){P.unMute();P.setVolume(100);}else if(m.cmd==="stop")P.stopVideo();else if(m.cmd==="seek")P.seekTo(m.t,true);}catch(err){}});
  setInterval(function(){if(P&&P.getCurrentTime)post({ev:"time",t:P.getCurrentTime(),d:P.getDuration()});},1000);
})();
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body></html>
