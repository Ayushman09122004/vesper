  publish:
    needs: [bot1, bot2, bot3, bot4, bot5, bot6, bot7, bot8, bot9, bot10, bot11, bot12]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - id: got
        uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: catalog-out, path: .done }
      - name: Check the result
        id: ok
        if: steps.got.outcome == 'success'
        run: |
          # must be real AND newer than what's already published (never re-publish an old file)
          node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync(".done/catalog.json"));let o={};try{o=JSON.parse(fs.readFileSync("catalog.json"))}catch(e){}
            const n=(c.titles||c.t||[]).length; if(n<500){console.log("too small",n);process.exit(1)}
            if(o.generated&&Date.parse(c.generated)<=Date.parse(o.generated)){console.log("not newer than the published one",c.generated);process.exit(2)}
            console.log(n,"titles,",c.generated)' || { [ $? = 2 ] && echo "nothing new to publish" && exit 0; exit 1; }
          [ -f .done/catalog.json ] && cp .done/catalog.json catalog.json
          [ -f .done/catalog-more.json ] && cp .done/catalog-more.json catalog-more.json
          [ -d .done/catalog-more/ ] && rm -rf catalog-more/ && cp -R .done/catalog-more/ catalog-more/
          echo "fresh=1" >> "$GITHUB_OUTPUT"
      - name: Publish
        if: steps.ok.outputs.fresh == '1'
        run: |
          git config user.name "Vesper robot"
          git config user.email "actions@users.noreply.github.com"
          git add catalog.json catalog-more.json catalog-more/
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Refresh catalog $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && exit 0; sleep 5; done; exit 1
      # trailers are a nice extra: after the catalog is safely out, never blocking it
      - name: Trailers
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 20
        run: |
          node tools/trailers.mjs 600 || true
          git add trailers.json
          git diff --cached --quiet && exit 0
          git commit -m "Trailers $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && exit 0; sleep 5; done
      - name: Nothing new — tell the owner if it's getting old
        if: ${{ !cancelled() && steps.ok.outputs.fresh != '1' }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          # only alarm when the PUBLISHED file is really getting old (a later run today may still make it)
          age=$(node -e 'console.log(Math.round((Date.now()-Date.parse(JSON.parse(require("fs").readFileSync("catalog.json")).generated))/36e5))')
          echo "published catalog.json is ${age}h old"
          [ "$age" -lt 30 ] && exit 0
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          n=$(gh issue list --state open --label robot-failed --json number,title --jq '.[] | select(.title | contains("Refresh catalog")) | .number' 2>/dev/null | head -1)
          if [ -n "$n" ]; then gh issue comment "$n" --body "Still failing ($(date -u +%F), ${age}h old): $url"
          else gh label create robot-failed --color d73a4a --force >/dev/null 2>&1 || true
               gh issue create --label robot-failed --title "Refresh catalog: data is ${age}h old" --body "The bots couldn't build it. Run log: $url"; fi
          exit 1
      - name: All good — close any alert
        if: steps.ok.outputs.fresh == '1'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          for n in $(gh issue list --state open --label robot-failed --json number,title --jq '.[] | select(.title | contains("Refresh catalog")) | .number' 2>/dev/null); do
            gh issue close "$n" --comment "Updated fine on $(date -u +%F)."; done
