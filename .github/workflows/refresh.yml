    needs: [bot1, bot2, bot3, bot4, bot5, bot6, bot7, bot8, bot9, bot10]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - id: got
        uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: catalog, path: .done }
      - name: Check the catalog
        id: ok
        if: steps.got.outcome == 'success'
        run: |
          node -e 'const c=JSON.parse(require("fs").readFileSync(".done/catalog.json"));if(!(c.titles&&c.titles.length>=500))process.exit(1);console.log(c.titles.length,"titles,",c.generated)'
          cp .done/catalog.json catalog.json
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/trailers.mjs 600
        continue-on-error: true
      - name: Publish
        run: |
          git config user.name "Vesper robot"
          git config user.email "actions@users.noreply.github.com"
          git add catalog.json trailers.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Daily catalog $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && exit 0; sleep 5; done; exit 1
      - name: No catalog today — tell the owner
        if: steps.ok.outcome != 'success'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          # only alarm when the PUBLISHED catalog is really getting old (a later run today may still make it)
          age=$(node -e 'console.log(Math.round((Date.now()-Date.parse(JSON.parse(require("fs").readFileSync("catalog.json")).generated))/36e5))')
          echo "published catalog is ${age}h old"
          [ "$age" -lt 30 ] && exit 0
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          n=$(gh issue list --state open --label robot-failed --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$n" ]; then gh issue comment "$n" --body "Still failing ($(date -u +%F), catalog ${age}h old): $url"
          else gh label create robot-failed --color d73a4a --force >/dev/null 2>&1 || true
               gh issue create --label robot-failed --title "Vesper catalog is ${age}h old" --body "The bots couldn't build today's catalog. Run log: $url"; fi
          exit 1
      - name: All good — close any alert
        if: steps.ok.outcome == 'success'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          for n in $(gh issue list --state open --label robot-failed --json number --jq '.[].number' 2>/dev/null); do
            gh issue close "$n" --comment "Catalog updated fine on $(date -u +%F)."; done
