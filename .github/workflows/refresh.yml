# GENERATED by tools/gen-workflows.py — edit that, not this.
# Refresh catalog: Vesper's daily catalog: everything on your five apps in India, plus the lists the rows use.
# A relay of 12 bots, no computer or phone needed: each bot is a fresh GitHub machine that continues where the
# last one was blocked by JustWatch. Runs every morning; later runs stop at once when today's data is out.
name: Refresh catalog
on:
  schedule:
    - cron: "30 0 * * *"    # 06:00 India
    - cron: "30 2 * * *"    # 08:00 — only if 06:00 didn't make it
    - cron: "30 5 * * *"    # 11:00
    - cron: "30 9 * * *"    # 15:00
  workflow_dispatch:
    inputs:
      force: { description: "Build even if today's data is already out", type: boolean, default: false }
permissions:
  contents: write
  issues: write
  actions: read
concurrency:
  group: catalog
  cancel-in-progress: false
env:
  JW_CACHE: jwcache/answers.json.gz
  JW_PACE_MS: "500"
  SKIP_IF_FRESH_HOURS: ${{ inputs.force && '0' || '20' }}
jobs:
  bot1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - id: have
        name: Already built by an earlier bot?
        uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: catalog-out, path: .done }
      - name: Progress from the bots before
        if: steps.have.outcome != 'success'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: catalog-progress, path: jwcache }
      - uses: actions/setup-node@v4
        if: steps.have.outcome != 'success'
        with: { node-version: 22 }
      - id: build
        name: Build (bot 1)
        if: steps.have.outcome != 'success'
        run: |
          set +e
          node tools/build-catalog.mjs; code=$?
          # words, not numbers: GitHub's conditions treat '' == '0' as true
          case $code in 0) res=done;; 3) res=partial;; *) res=error;; esac
          echo "result=$res" >> "$GITHUB_OUTPUT"
          [ "$res" = error ] && echo "::warning::bot 1 hit an error — the next bot carries on"
          exit 0
      - name: Hand progress on
        if: steps.build.outputs.result == 'partial' || steps.build.outputs.result == 'error'
        uses: actions/upload-artifact@v4
        with: { name: catalog-progress, path: jwcache/, overwrite: true, retention-days: 1, if-no-files-found: warn }
      - name: Hand over the result
        if: steps.build.outputs.result == 'done'
        uses: actions/upload-artifact@v4
        with:
          name: catalog-out
          retention-days: 1
          path: |
            catalog.json
            catalog-more.json
            catalog-more/
