# Vesper's daily catalog — a relay of bots, no computer or phone needed.
# JustWatch blocks one machine's address after ~75 quick requests; a full build needs ~400. Each bot below is a fresh
# GitHub machine (fresh address): it replays everything the bots before it saved, fetches until JustWatch blocks it,
# then hands its saved answers on. The first bot to finish the build hands over the catalog; "publish" commits it.
# Runs 4x every morning; once today's catalog is published, later runs stop at once. Fails → GitHub issue (email).
name: Refresh catalog
on:
  schedule:
    - cron: "30 0 * * *"    # 06:00 India
    - cron: "30 2 * * *"    # 08:00 — only if 06:00 didn't make it
    - cron: "30 5 * * *"    # 11:00
    - cron: "30 9 * * *"    # 15:00
  workflow_dispatch:
    inputs:
      force: { description: "Build even if today's catalog is already out", type: boolean, default: false }
permissions:
  contents: write
  issues: write
  actions: read
concurrency:
  group: catalog
  cancel-in-progress: false
env:
  JW_CACHE: jwcache/answers.json.gz
  JW_PACE_MS: "500"
  SKIP_IF_FRESH_HOURS: ${{ inputs.force && '0' || '20' }}
jobs:
  bot1:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - id: have
        name: Catalog already built by an earlier bot?
        uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: catalog, path: .done }
      - name: Progress from the bots before
        if: steps.have.outcome != 'success'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: progress, path: jwcache }
      - uses: actions/setup-node@v4
        if: steps.have.outcome != 'success'
        with: { node-version: 22 }
      - id: build
        name: Build (bot 1)
        if: steps.have.outcome != 'success'
        run: |
          set +e
          node tools/build-catalog.mjs; code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" = 1 ] && echo "::warning::bot 1 hit an error — the next bot carries on"
          exit 0
      - name: Hand progress on
        if: steps.build.outputs.code != '' && steps.build.outputs.code != '0'
        uses: actions/upload-artifact@v4
        with: { name: progress, path: jwcache/, overwrite: true, retention-days: 1, if-no-files-found: warn }
      - name: Hand over the catalog
        if: steps.build.outputs.code == '0'
        uses: actions/upload-artifact@v4
        with: { name: catalog, path: catalog.json, retention-days: 1 }
