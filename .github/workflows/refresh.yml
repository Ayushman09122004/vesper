name: Refresh catalog
on:
  schedule:
    - cron: "30 0 * * *"   # every day at 06:00 India time
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build-catalog.mjs
      - run: node tools/trailers.mjs 600
        continue-on-error: true
      - name: Save new catalog
        run: |
          git config user.name "Vesper robot"
          git config user.email "actions@users.noreply.github.com"
          git add catalog.json trailers.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Daily catalog $(date -u +%F)"
          git push
