  publish:
    needs: [bot1, bot2, bot3, bot4, bot5, bot6, bot7, bot8, bot9, bot10]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Yesterday's data (from the live site)
        run: |
          git fetch -q origin gh-pages 2>/dev/null || exit 0
          for f in catalog.json catalog-more.json catalog-more netflix-world.json trailers.json; do
            git cat-file -e FETCH_HEAD:$f 2>/dev/null && { rm -rf $f; git archive FETCH_HEAD $f | tar -x; }; done; true
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - id: got
        uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: world-out, path: .done }
      - name: Check the result
        id: ok
        if: steps.got.outcome == 'success'
        run: |
          # must be real AND newer than what's already published (never re-publish an old file)
          node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync(".done/netflix-world.json"));let o={};try{o=JSON.parse(fs.readFileSync("netflix-world.json"))}catch(e){}
            const n=(c.titles||c.t||[]).length; if(n<5000){console.log("too small",n);process.exit(1)}
            if(o.generated&&Date.parse(c.generated)<=Date.parse(o.generated)){console.log("not newer than the published one",c.generated);process.exit(2)}
            console.log(n,"titles,",c.generated)' || { [ $? = 2 ] && echo "nothing new to publish" && exit 0; exit 1; }
          [ -f .done/netflix-world.json ] && cp .done/netflix-world.json netflix-world.json
          echo "fresh=1" >> "$GITHUB_OUTPUT"
      - name: Publish
        if: steps.ok.outputs.fresh == '1'
        run: bash tools/deploy-site.sh .done   # one snapshot on gh-pages — no history, the repo never grows
      - name: Nothing new — tell the owner if it's getting old
        if: ${{ !cancelled() && steps.ok.outputs.fresh != '1' }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          # only alarm when the PUBLISHED file is really getting old (a later run today may still make it)
          age=$(node -e 'console.log(Math.round((Date.now()-Date.parse(JSON.parse(require("fs").readFileSync("netflix-world.json")).generated))/36e5))')
          echo "published netflix-world.json is ${age}h old"
          [ "$age" -lt 54 ] && exit 0
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          n=$(gh issue list --state open --label robot-failed --json number,title --jq '.[] | select(.title | contains("Netflix worldwide")) | .number' 2>/dev/null | head -1)
          if [ -n "$n" ]; then gh issue comment "$n" --body "Still failing ($(date -u +%F), ${age}h old): $url"
          else gh label create robot-failed --color d73a4a --force >/dev/null 2>&1 || true
               gh issue create --label robot-failed --title "Netflix worldwide: data is ${age}h old" --body "The bots couldn't build it. Run log: $url"; fi
          exit 1
      - name: All good — close any alert
        if: steps.ok.outputs.fresh == '1'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          for n in $(gh issue list --state open --label robot-failed --json number,title --jq '.[] | select(.title | contains("Netflix worldwide")) | .number' 2>/dev/null); do
            gh issue close "$n" --comment "Updated fine on $(date -u +%F)."; done
