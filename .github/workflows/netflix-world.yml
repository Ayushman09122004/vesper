# GENERATED by tools/gen-workflows.py — edit that, not this.
# Netflix worldwide: which of 48 countries has each title on Netflix (for Search → Netflix worldwide).
# A relay of 10 bots, no computer or phone needed: each bot is a fresh GitHub machine that continues where the
# last one was blocked by JustWatch. Runs every morning; later runs stop at once when today's data is out.
name: Netflix worldwide
on:
  schedule:
    - cron: "0 1 * * *"    # 06:30 India
    - cron: "0 4 * * *"    # 09:30 — only if 06:30 didn't make it
    - cron: "0 8 * * *"    # 13:30
  workflow_dispatch:
    inputs:
      force: { description: "Build even if today's data is already out", type: boolean, default: false }
permissions:
  contents: write
  issues: write
  actions: read
concurrency:
  group: world
  cancel-in-progress: false
env:
  JW_CACHE: jwcache/answers.json.gz
  JW_PACE_MS: "500"
  SKIP_IF_FRESH_HOURS: ${{ inputs.force && '0' || '20' }}
jobs:
  bot1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Yesterday's data (from the live site)
        run: |
          git fetch -q origin gh-pages 2>/dev/null || exit 0
          for f in catalog.json catalog-more.json catalog-more netflix-world.json trailers.json; do
            git cat-file -e FETCH_HEAD:$f 2>/dev/null && { rm -rf $f; git archive FETCH_HEAD $f | tar -x; }; done; true
      - id: have
        name: Already built by an earlier bot?
        uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: world-out, path: .done }
      - name: Progress from the bots before
        if: steps.have.outcome != 'success'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: world-progress, path: jwcache }
      - uses: actions/setup-node@v4
        if: steps.have.outcome != 'success'
        with: { node-version: 22 }
      - id: build
        name: Build (bot 1)
        if: steps.have.outcome != 'success'
        run: |
          set +e
          node tools/netflix-world.mjs; code=$?
          # words, not numbers: GitHub's conditions treat '' == '0' as true
          case $code in 0) res=done;; 3) res=partial;; *) res=error;; esac
          echo "result=$res" >> "$GITHUB_OUTPUT"
          [ "$res" = error ] && echo "::warning::bot 1 hit an error — the next bot carries on"
          exit 0
      - name: Hand progress on
        if: steps.build.outputs.result == 'partial' || steps.build.outputs.result == 'error'
        uses: actions/upload-artifact@v4
        with: { name: world-progress, path: jwcache/, overwrite: true, retention-days: 1, if-no-files-found: warn }
      - name: Hand over the result
        if: steps.build.outputs.result == 'done'
        uses: actions/upload-artifact@v4
        with:
          name: world-out
          retention-days: 1
          path: |
            netflix-world.json
